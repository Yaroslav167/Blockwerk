name: Native builds and tests
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Attach tested POSIX bundles to the existing version release
        type: boolean
        default: false
  push:
    paths:
      - '**.py'
      - 'requirements*.txt'
      - '.github/workflows/build.yml'
jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libdbus-1-3 fonts-dejavu-core
      - name: Validate POSIX startup scripts
        if: runner.os != 'Windows'
        run: sh -n start-linux.sh start-macos.command
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python tests/integration_releases.py
      - run: python tools/build.py
      - run: python tools/smoke_native.py
      - run: python tools/archive.py
      - name: Upload startup evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Evidence-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/smoke-*.png
            dist/platform-check.json
          if-no-files-found: warn
      - name: Upload native bundle
        uses: actions/upload-artifact@v4
        with:
          name: Blockwerk-${{ runner.os }}-${{ runner.arch }}
          path: dist/Blockwerk-*.tar.gz
          if-no-files-found: error
      - name: Publish tested native Linux and macOS bundles
        if: runner.os != 'Windows' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib, pathlib, platform
          output = pathlib.Path('dist')
          packages = sorted(output.glob('Blockwerk-*.tar.gz'))
          assert len(packages) == 1
          checksums = output / ('SHA256-' + platform.system() + '-' + platform.machine() + '.txt')
          checksums.write_text(''.join(hashlib.file_digest(p.open('rb'), 'sha256').hexdigest() + '  ' + p.name + '\n' for p in packages), encoding='ascii')
          PY
          release_tag="v$(python -c 'from blockwerk.core import VERSION; print(VERSION)')"
          gh release upload "$release_tag" dist/Blockwerk-*.tar.gz dist/SHA256-*.txt
